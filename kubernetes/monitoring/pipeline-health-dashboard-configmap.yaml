apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-health-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  pipeline-health.json: |
    {
      "title": "Pipeline Health",
      "tags": ["data-pipeline"],
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "hide": 0,
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Airflow Task Outcomes (last hour)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "targets": [
            {
              "expr": "increase(airflow_task_finish_detail{state=~\"success|failed\"}[1h])",
              "legendFormat": "{{task_id}} - {{state}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },
        {
          "id": 2,
          "title": "Kafka Connect Task Status (currently active)",
          "type": "table",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "targets": [
            {
              "expr": "kafka_connect_connector_task_status == 1",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true,
                  "__name__": true,
                  "container": true,
                  "endpoint": true,
                  "instance": true,
                  "job": true,
                  "namespace": true,
                  "pod": true,
                  "service": true
                }
              }
            }
          ],
          "fieldConfig": { "defaults": {}, "overrides": [] }
        },
        {
          "id": 3,
          "title": "Kafka Connect Consumer Lag",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "targets": [
            {
              "expr": "kafka_connect_consumer_records_lag_max",
              "legendFormat": "{{client_id}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },
        {
          "id": 4,
          "title": "Airflow Executor Load",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "targets": [
            {
              "expr": "airflow_executor_running_tasks",
              "legendFormat": "running ({{pod}})",
              "refId": "A"
            },
            {
              "expr": "airflow_executor_queued_tasks",
              "legendFormat": "queued ({{pod}})",
              "refId": "B"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },
        {
          "id": 5,
          "title": "Kafka Broker Request Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "targets": [
            {
              "expr": "sum by (request) (rate(kafka_network_requests_total[5m]))",
              "legendFormat": "{{request}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] }
        }
      ]
    }
