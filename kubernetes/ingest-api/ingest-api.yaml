apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-api
  namespace: ingest-api
  labels:
    app: ingest-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingest-api
  template:
    metadata:
      labels:
        app: ingest-api
      annotations:
        iam.gke.io/gcp-service-account: sa-ingest-api@crowdsource-data-app-clone.iam.gserviceaccount.com
    spec:
      serviceAccountName: ksa-ingest-api
      enableServiceLinks: false
      containers:
        - name: ingest-api
          image: europe-west2-docker.pkg.dev/crowdsource-data-app-clone/crowdsource-data-app/ingest-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "crowdsource-data-app-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
            - name: SCHEMA_REGISTRY_URL
              value: "http://schema-registry.kafka.svc.cluster.local:8081"
            - name: KAFKA_TOPIC
              value: "raw-measurements"
            - name: DLQ_TOPIC
              value: "raw-measurements-dlq"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ingest-api
  namespace: ingest-api
  labels:
    app: ingest-api
spec:
  # Internal ClusterIP — used by simulator to reach the API
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: ingest-api
---
apiVersion: v1
kind: Service
metadata:
  name: ingest-api-lb
  namespace: ingest-api
  labels:
    app: ingest-api
  annotations:
    # Attach the static IP reserved in Phase 00
    kubernetes.io/ingress.allow-http: "true"
spec:
  type: LoadBalancer
  loadBalancerIP: 34.89.87.57
  ports:
    - port: 80
      targetPort: 8000
      name: http
  selector:
    app: ingest-api
