apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: crowdsource-data-app-kafka
  namespace: kafka
  annotations:
    # Required annotation to tell Strimzi to use KRaft mode
    # and KafkaNodePool resources instead of inline spec
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.1.0

    # metadataVersion must match your Kafka version
    metadataVersion: 4.1-IV0

    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false

    config:
      # Replication
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2

      # Retention defaults
      log.retention.hours: 72

      # Performance
      num.network.threads: 3
      num.io.threads: 8
      socket.send.buffer.bytes: 102400
      socket.receive.buffer.bytes: 102400
      socket.request.max.bytes: 104857600

    # Prometheus metrics
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics-config
          key: kafka-metrics-config.yml

  # No spec.zookeeper block — KRaft handles consensus internally
  # No spec.kafka.replicas — KafkaNodePool handles this
  # No spec.kafka.storage — KafkaNodePool handles this
  # No spec.kafka.resources — KafkaNodePool handles this

  entityOperator:
    topicOperator:
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
    userOperator:
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
