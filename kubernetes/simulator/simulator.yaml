apiVersion: apps/v1
kind: Deployment
metadata:
  name: measurement-simulator
  namespace: ingest-api
  labels:
    app: measurement-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: measurement-simulator
  template:
    metadata:
      labels:
        app: measurement-simulator
    spec:
      enableServiceLinks: false
      containers:
        - name: simulator
          image: europe-west2-docker.pkg.dev/crowdsource-data-app-clone/crowdsource-data-app/simulator/simulator
          env:
            - name: INGEST_API_URL
              value: "http://ingest-api:8000/measurements"
            - name: EVENTS_PER_SECOND
              value: "2"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 512Mi
