# ── Airflow image ─────────────────────────────────────────────────────────────
defaultAirflowTag: "2.9.2"
airflowVersion: "2.9.2"

# ── Executor ──────────────────────────────────────────────────────────────────
executor: KubernetesExecutor

# ── Database — Cloud SQL PostgreSQL ──────────────────────────────────────────
data:
  metadataConnection:
    user: airflow
    pass: fAZHULPPWrL63PcwkluzX5fB
    host: 10.47.0.3
    port: 5432
    db: airflow
    protocol: postgresql

# ── Disable built-in Postgres (we use Cloud SQL) ─────────────────────────────
postgresql:
  enabled: false

# ── Web server ────────────────────────────────────────────────────────────────
webserver:
  defaultUser:
    enabled: true
    role: Admin
    username: admin
    email: admin@crowdsource.dev
    firstName: Admin
    lastName: User
    password: crowdsource-dev-2026
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  startupProbe:
    failureThreshold: 30
    periodSeconds: 15
    timeoutSeconds: 30
  livenessProbe:
    failureThreshold: 10
    periodSeconds: 30
    timeoutSeconds: 30
  readinessProbe:
    failureThreshold: 10
    periodSeconds: 30
    timeoutSeconds: 30

# ── Scheduler ─────────────────────────────────────────────────────────────────
scheduler:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

# ── Triggerer ─────────────────────────────────────────────────────────────────
triggerer:
  enabled: false
  # resources:
  #   requests:
  #     cpu: 50m
  #     memory: 128Mi
  #   limits:
  #     cpu: 200m
      # memory: 256Mi

# ── Service accounts ──────────────────────────────────────────────────────────
serviceAccount:
  create: false
  name: ksa-airflow

workers:
  serviceAccount:
    create: false
    name: ksa-airflow

# ── DAGs — GitSync pulls from GitHub repo ────────────────────────────────────
dags:
  gitSync:
    enabled: true
    repo: https://github.com/bassemessam1/crowdsource-data-app-clone.git
    branch: main
    rev: HEAD
    depth: 1
    maxFailures: 3
    subPath: airflow/dags
    period: 60s
    resources:
      requests:
        cpu: 50m
        memory: 64Mi

# ── Logs ──────────────────────────────────────────────────────────────────────
logs:
  persistence:
    enabled: false

# ── Config ────────────────────────────────────────────────────────────────────
config:
  core:
    load_examples: "False"
  kubernetes_executor:
    namespace: airflow
    worker_service_account_name: ksa-airflow
  logging:
    logging_level: INFO
